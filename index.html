<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>WINNIE MEALS Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#06C755;--dg:#008F3D;--ob:#0B0F0D;--sg:#F4F6F5;--ch:#202522;--y:#F4B942;--mu:#6b746f;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;font-family:Quicksand,system-ui,sans-serif}
html,body{height:100%;background:var(--ob);color:#fff;overflow:hidden}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{border:0;cursor:pointer;color:inherit;background:none}
#st{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 12px}
#hd{text-align:center;font-weight:700;letter-spacing:.5px;line-height:1.15}#hd small{display:block;font-weight:500;color:#8a948f;font-size:12px}
#mid{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#ph{width:414px;height:868px;border-radius:62px;background:#000;padding:12px;transform-origin:center;box-shadow:0 0 0 2px #2a302d,0 40px 90px #000a,0 0 120px #06c75522;position:relative;flex:none}
#sc{width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;background:#fff;color:var(--ch)}
#sc:before{content:"";position:absolute;top:11px;left:50%;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px;z-index:50}
.s{position:absolute;inset:0;padding:60px 20px 20px;overflow:hidden;animation:in .6s var(--e) both}
.s.out{animation:out .45s var(--e) both}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,40px))}}
@keyframes out{to{opacity:0;transform:translateX(calc(var(--dx,40px)*-.6))}}
.dk{background:var(--ob);color:#fff}.sg{background:var(--sg)}
h1{font-size:28px;line-height:1.1;font-weight:700}h2{font-size:22px;font-weight:700}p,.mu{color:var(--mu);font-weight:500}.dk p{color:#9aa49f}
.btn{display:block;width:100%;padding:16px;border-radius:18px;background:var(--g);color:#fff;font-weight:700;font-size:16px;transition:transform .2s var(--e)}
.btn:active{transform:scale(.97)}.btn.o{background:none;border:2px solid var(--sg);color:var(--ch)}
.inp{background:var(--sg);border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:600}.inp small{display:block;color:var(--mu);font-size:11px;font-weight:600}
.card{background:#fff;border-radius:20px;padding:12px;box-shadow:0 6px 18px #0b0f0d14;transition:transform .3s var(--e)}.card:hover{transform:translateY(-3px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;gap:8px;overflow:hidden;margin:14px 0}.chip{padding:9px 14px;border-radius:20px;background:var(--sg);font-weight:600;font-size:13px;white-space:nowrap}.chip.on{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:#fff;display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--sg)}
.nav button{font-size:11px;font-weight:600;color:#9aa39e;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}.nav .on{color:var(--g)}
.bdg{position:absolute;top:-4px;right:-6px;background:var(--y);color:var(--ch);font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px}.bump{animation:bump .5s var(--e)}
@keyframes bump{40%{transform:scale(1.6)}}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #cfd6d2;display:grid;place-items:center;color:#fff;transition:.25s}.chk.on{background:var(--g);border-color:var(--g)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:22px 20px 30px;box-shadow:0 -20px 60px #0008;z-index:20;animation:up .6s var(--e)}
.sheet.n{animation:none}.out.sheet,.out.ov{pointer-events:none}.ov{position:absolute;inset:0;background:#0b0f0d99;z-index:19}
@keyframes up{from{transform:translateY(100%)}}
.ckc{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .7s .3s var(--e) forwards}@keyframes dr{to{stroke-dashoffset:0}}
.pop{animation:pop .7s var(--e)}@keyframes pop{from{transform:scale(.3);opacity:0}}
.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px)}}
.sp{width:46px;height:46px;border-radius:50%;border:5px solid #e3e8e5;border-top-color:var(--g);animation:rot 1s linear infinite;margin:auto}@keyframes rot{to{transform:rotate(360deg)}}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.4}}
.tl div{display:flex;gap:10px;align-items:center;padding:5px 0;font-weight:600;font-size:14px}.tl i{width:20px;height:20px;border-radius:50%;border:2px solid #cfd6d2;display:grid;place-items:center;font-size:11px;font-style:normal;color:#fff}.tl .d i{background:var(--g);border-color:var(--g)}.tl .d{color:var(--ch)}.tl div:not(.d){color:var(--mu)}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700}.tp{background:#d9f7e5;color:var(--dg)}.tw{background:#fdf0d1;color:#8a5d00}.tb{background:#e4e8e6;color:var(--ch)}
#cn{display:flex;gap:14px;align-items:center;justify-content:center;padding-top:6px}
#cn button{padding:13px 28px;border-radius:30px;font-weight:700;font-size:15px;background:#1b211e;transition:transform .2s var(--e)}#cn button:hover{transform:translateY(-2px)}#cn button:active{transform:scale(.95)}
#nx{background:var(--g)!important;color:#fff;box-shadow:0 8px 24px #06c75566}#cn span{font-size:13px;color:#8a948f;font-weight:600;min-width:84px;text-align:center}
#tt{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:#fff;color:var(--ch);padding:10px 18px;border-radius:20px;font-weight:700;font-size:14px;z-index:99;transition:transform .5s var(--e)}#tt.on{transform:translate(-50%,0)}
/* admin */
#ad{display:none;width:100%;max-width:1180px;height:100%;background:var(--sg);color:var(--ch);border-radius:20px;overflow:hidden;animation:in .8s var(--e)}
.adm #ad{display:flex}#br{display:none;flex-direction:column;align-items:center;text-align:center;gap:16px;max-width:600px;padding:20px;animation:in .8s var(--e)}#br h1{font-size:34px}.brg #br{display:flex}.brg #ph{display:none}.adm #ph{display:none}
#sb{width:200px;background:var(--ob);color:#9aa49f;padding:20px 12px;flex:none}#sb button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:12px;font-weight:600;position:relative;margin-top:2px}#sb .on{color:#fff;background:#1b211e}#sb .on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--g)}
#am{flex:1;overflow:auto;padding:24px}#am h1{margin-bottom:16px;font-size:26px}
.st4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border-radius:18px;padding:16px}.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-weight:600;font-size:13px}
.pn{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px}.pn h2{font-size:17px;margin-bottom:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tr{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.3fr;gap:8px;padding:11px 8px;border-bottom:1px solid var(--sg);font-weight:600;font-size:14px;align-items:center;cursor:pointer;border-radius:10px}.tr:hover,.tr.on{background:var(--sg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 14px;border-radius:18px;background:#fff;font-weight:600;font-size:13px}.tabs .on{background:var(--ob);color:#fff}
.bar{transform-origin:bottom;transform:scaleY(0);animation:grow .9s var(--e) forwards}@keyframes grow{to{transform:scaleY(1)}}
.ab{padding:11px 16px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;margin:4px 6px 0 0}.ab.k{background:var(--ob)}
@media(max-width:700px){#sb{display:none}.adm #hd{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div id="st"><div id="hd">WINNIE MEALS<small id="sub">Prototype · Customer Experience</small></div>
<div id="mid"><div id="ph"><div id="sc"></div></div>
<div id="br"><div class="row" style="gap:10px;justify-content:center;font-weight:700"><span class="chip on">Customer experience</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#06C755" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="chip" style="background:#1b211e;color:#fff">Business operations</span></div><h1>This is how you will be tracking and managing your store.</h1><p style="color:#9aa49f;font-size:16px">Every order, payment, product and delivery your customers create appears here in real time.</p><button class="btn" style="width:auto;padding:16px 34px;margin-top:8px" data-a="go">Open the dashboard</button></div><div id="ad"><div id="sb"></div><div id="am"></div></div></div>
<div id="cn"><button id="bk">← Back</button><span id="pg"></span><button id="nx">Next →</button></div></div>
<div id="tt"></div>
<script>
const $=q=>document.querySelector(q),K=v=>'KSh '+v.toLocaleString();
/* illustrations */
const F={
burger:'<ellipse cx="50" cy="85" rx="36" ry="6" fill="#0b0f0d22"/><path d="M14 46a36 30 0 0172 0z" fill="#F4B942"/><path d="M12 52q8 8 15 0t15 0 15 0 15 0 14 0v4H12z" fill="#06C755"/><rect x="12" y="58" width="76" height="11" rx="5" fill="#202522"/><path d="M12 72h76q0 12-14 12H26q-14 0-14-12z" fill="#F4B942"/><circle cx="35" cy="34" r="2" fill="#fff"/><circle cx="52" cy="28" r="2" fill="#fff"/><circle cx="66" cy="36" r="2" fill="#fff"/>',
pizza:'<path d="M50 90L12 22q38-18 76 0z" fill="#F4B942"/><path d="M12 22q38-18 76 0l-2 6q-36-16-72 0z" fill="#202522"/><circle cx="42" cy="40" r="6" fill="#008F3D"/><circle cx="60" cy="48" r="6" fill="#06C755"/><circle cx="50" cy="66" r="5" fill="#008F3D"/><circle cx="68" cy="36" r="4" fill="#fff"/>',
chicken:'<ellipse cx="50" cy="90" rx="30" ry="5" fill="#0b0f0d22"/><ellipse cx="46" cy="40" rx="28" ry="24" fill="#F4B942" transform="rotate(-25 46 40)"/><path d="M62 58L82 80" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="84" cy="82" r="6" fill="#fff"/><path d="M30 30q10-10 24-6" stroke="#fff6" stroke-width="5" fill="none" stroke-linecap="round"/>',
cake:'<ellipse cx="50" cy="88" rx="38" ry="5" fill="#0b0f0d22"/><path d="M12 80V44l76-12v48z" fill="#202522"/><path d="M12 44l76-12v10q-10 8-20 2t-20 2-20 2-16 4z" fill="#fff"/><circle cx="26" cy="38" r="6" fill="#06C755"/><rect x="12" y="62" width="76" height="4" fill="#008F3D"/>',
fries:'<g fill="#F4B942"><rect x="26" y="14" width="9" height="46" rx="3"/><rect x="38" y="8" width="9" height="50" rx="3"/><rect x="50" y="12" width="9" height="48" rx="3"/><rect x="62" y="18" width="9" height="42" rx="3"/></g><path d="M20 52h60l-8 36H28z" fill="#06C755"/><text x="50" y="76" font-size="20" font-weight="700" text-anchor="middle" fill="#fff">W</text>',
drink:'<path d="M52 8l6 18" stroke="#F4B942" stroke-width="5" stroke-linecap="round"/><path d="M26 28h48l-6 60H32z" fill="#fff" stroke="#202522" stroke-width="3"/><path d="M29 52h42l-3 36H32z" fill="#06C755"/><rect x="22" y="22" width="56" height="9" rx="4" fill="#202522"/>',
bag:'<ellipse cx="50" cy="92" rx="34" ry="5" fill="#0b0f0d33"/><path d="M26 34h48l6 56H20z" fill="#06C755"/><path d="M36 34q0-18 14-18t14 18" stroke="#008F3D" stroke-width="6" fill="none"/><path d="M34 70l8-24 8 16 8-16 8 24" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
};
const I=(n,s=90)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100">${F[n]}</svg>`;
const X={pin:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>`,search:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`,cart:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><path d="M3 4h3l3 11h9l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>`,phone:`<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>`,sc:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-9H8M16 8h3"/></svg>`,star:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="currentColor"/></svg>`,ck:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex:none"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`};
const logo=(s=70)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L21 52 32 28 43 52 55 14" stroke="#06C755" stroke-width="7"/><path d="M5 4v10M9 4v10M13 4v10" stroke="#fff" stroke-width="2.5"/><ellipse cx="55" cy="8" rx="4.5" ry="6" fill="#F4B942" stroke="none"/></svg>`;
const ic=n=>({home:'<path d="M3 11l9-8 9 8v10H3z"/>',orders:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',cart:'<path d="M3 4h3l3 11h9l2-8H7"/><circle cx="10" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21q0-7 8-7t8 7"/>'}[n]);
const nv=a=>`<div class="nav">${['home','orders','cart','profile'].map(k=>`<button class="${a==k?'on':''}" data-a="nav" data-k="${k}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic(k)}</svg>${k[0].toUpperCase()+k.slice(1)}${k=='cart'&&S.cart?`<b class="bdg ${S.bump?'bump':''}">${S.cart}</b>`:''}</button>`).join('')}</div>`;
const ck=(c='#06C755',s=96)=>`<svg class="pop" width="${s}" height="${s}" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="${c}"/><path class="ckc" d="M28 50l14 14 27-30" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const S={i:0,q:1,ch:0,sa:0,fr:0,cart:0,cat:'Burgers',eta:'18 min'};
const items=()=>[[`Classic Burger × ${S.q}`+(S.ch?' + cheese':'')+(S.sa?' + sauce':''),(450+S.ch*80+S.sa*40)*S.q],...(S.fr?[['Fries × 1',120]]:[])];
const sub=()=>items().reduce((a,b)=>a+b[1],0),tot=()=>sub()+100;
const sum=()=>`<div class="card" style="margin:12px 0">${items().map(r=>`<div class="row" style="padding:4px 0;font-weight:600"><span>${r[0]}</span><span>${K(r[1])}</span></div>`).join('')}<div class="row mu" style="padding:4px 0"><span>Delivery</span><span>${K(100)}</span></div><div class="row" style="border-top:1px solid var(--sg);margin-top:6px;padding-top:8px;font-weight:700;font-size:18px"><span>Total</span><span>${K(tot())}</span></div></div>`;
/* map */
const mapSvg=(w=350,h=300)=>`<svg id="mp" viewBox="0 0 390 340" width="${w}" height="${h}" style="border-radius:24px;background:#e9efeb"><g fill="#d5ddd8"><rect x="20" y="20" width="90" height="60" rx="8"/><rect x="140" y="30" width="70" height="90" rx="8"/><rect x="250" y="20" width="110" height="50" rx="8"/><rect x="20" y="130" width="70" height="80" rx="8"/><rect x="260" y="170" width="100" height="70" rx="8"/><rect x="60" y="260" width="110" height="60" rx="8"/><rect x="230" y="270" width="120" height="50" rx="8"/></g><path d="M0 110H390M0 240H390M120 0V340M230 0V340" stroke="#fff" stroke-width="14"/><path id="rt" d="M50 300C110 290 120 230 175 215S300 180 335 60" stroke="#c5cec9" stroke-width="7" fill="none" stroke-linecap="round"/><path id="rv" d="M50 300C110 290 120 230 175 215S300 180 335 60" stroke="#06C755" stroke-width="7" fill="none" stroke-linecap="round"/><g transform="translate(50 300)"><circle r="16" fill="#202522"/><path d="M-7 4v-7h14v7M-9-3l9-6 9 6" stroke="#fff" stroke-width="2" fill="none"/></g><g transform="translate(335 60)"><circle id="hm" r="17" fill="#F4B942"/><path id="hi" d="M-8 3v-7l8-6 8 6v7z" fill="#202522"/></g><g id="sco"><circle r="19" fill="#06C755" opacity=".25" class="pulse"/><circle r="13" fill="#06C755"/><path d="M-6 3h12M-4 3l2-7h5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></svg>`;
let cur=0,raf;
function mv(p,fast){const r=$('#rt'),v=$('#rv');if(!r)return;const L=r.getTotalLength(),s=$('#sco'),from=cur;cancelAnimationFrame(raf);const t0=performance.now(),D=fast?1:1700;
const f=n=>{let k=Math.min(1,(n-t0)/D);k=1-Math.pow(1-k,3);const q=from+(p-from)*k,pt=r.getPointAtLength(L*q);s.setAttribute('transform',`translate(${pt.x} ${pt.y})`);v.style.strokeDasharray=`${L*q} ${L}`;cur=q;if(k<1)raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
const TR={t18:[.35,'18 min','On the way',2],t10:[.6,'10 min','On the way',2],t5:[.82,'5 min','Almost there',2],t0:[1,'Arriving now','Rider is at your door',3]};
const trk=k=>{const[p,e,h,d]=TR[k];return`<div id="tkx"><div class="row"><div><h2>${h}</h2><p style="font-size:13px">Your order is heading to you.</p></div><div style="text-align:right"><b style="font-size:26px;color:var(--dg)">${e}</b><p style="font-size:11px">Estimated arrival</p></div></div><div class="card tl" style="margin-top:12px"><p style="font-size:12px;margin-bottom:4px">Classic Burger × 1 · #WM10248</p>${['Order received','Preparing your order','Out for delivery','Delivered'].map((t,j)=>`<div class="${j<d?'d':''}"><i>${j<d?X.ck:''}</i>${t}</div>`).join('')}</div></div>`};
/* screens */
const SC={
splash:()=>`<div class="s dk" style="text-align:center;padding-top:150px">${logo(110)}<h1 style="margin-top:14px;letter-spacing:2px;animation:in 1s .3s both">WINNIE MEALS</h1><p style="margin-top:6px;animation:in 1s .6s both">Good Food. Delivered.</p><div class="fl" style="margin-top:50px;animation:in 1s .9s both,fl 3s 1s infinite">${I('bag',170)}</div><div class="fl" style="position:absolute;left:50px;bottom:170px">${I('burger',50)}</div><div class="fl" style="position:absolute;right:50px;bottom:200px;animation-delay:.8s">${I('fries',50)}</div></div>`,
welcome:()=>`<div class="s" style="padding-top:70px"><div class="row" style="justify-content:center;gap:0">${I('pizza',100)}${I('burger',130)}${I('drink',90)}</div><h1 style="margin-top:36px">Delicious meals, right at your door.</h1><p style="margin:12px 0 40px">Fresh food. Easy ordering. Reliable delivery.</p><button class="btn" data-a="go">Create account</button><button class="btn o" style="margin-top:10px" data-a="t" data-m="Log in opens the sign-in form">Log in</button></div>`,
signup:()=>`<div class="s" style="padding-top:80px"><h1>Create your account</h1><p style="margin:6px 0 16px">It takes less than a minute.</p>${[['Full name','John Doe'],['Phone number','0712 345 678'],['Email address','john@example.com'],['Password','••••••••']].map(a=>`<div class="inp"><small>${a[0]}</small>${a[1]}</div>`).join('')}<button class="btn" style="margin-top:20px" data-a="go">Create account</button></div>`,
done:()=>`<div class="s dk" style="text-align:center;padding-top:260px">${ck()}<h1 style="margin-top:22px">Account created</h1><p style="margin-top:8px">Welcome to WINNIE MEALS, John.</p></div>`,
home:()=>{const P={Burgers:[['Classic Burger',450,'burger'],['Cheese Burger',520,'burger']],Pizza:[['Margherita Pizza',850,'pizza'],['Pepperoni Pizza',950,'pizza']],Chicken:[['Grilled Chicken',750,'chicken'],['Fried Chicken',700,'chicken']],Healthy:[['Garden Fries',300,'fries'],['Chicken Bowl',650,'chicken']],Desserts:[['Chocolate Cake',400,'cake'],['Vanilla Slice',350,'cake']],Drinks:[['Fresh Juice',250,'drink'],['Iced Tea',200,'drink']]};
return`<div class="s sg" style="padding-top:62px"><div class="row"><div><h2>Good afternoon, John</h2><p style="font-size:13px">${X.pin} Home · Thika Road, Nairobi</p></div>${logo(36)}</div><div class="inp" style="background:#fff;margin:14px 0;color:var(--mu)">${X.search} What are you craving?</div><div class="chips">${Object.keys(P).map(c=>`<span class="chip ${c==S.cat?'on':''}" data-a="cat" data-k="${c}">${c}</span>`).join('')}</div><div class="row"><h2 style="font-size:18px">Popular today</h2><span class="mu" style="font-size:13px">${S.cat}</span></div><div class="grid" style="margin-top:12px">${P[S.cat].concat(P.Burgers.slice(0,0)).map(p=>`<div class="card" data-a="${p[0]=='Classic Burger'?'go':'t'}" data-m="${p[0]} details open here"><div style="text-align:center;background:var(--sg);border-radius:14px;padding:6px">${I(p[2],84)}</div><b style="display:block;margin-top:8px;font-size:14px">${p[0]}</b><span style="color:var(--dg);font-weight:700">${K(p[1])}</span></div>`).join('')}</div>${nv('home')}</div>`},
product:()=>`<div class="s" style="padding-top:62px"><div style="background:var(--sg);border-radius:28px;text-align:center;padding:10px;animation:in .7s var(--e)">${I('burger',190)}</div><div class="row" style="margin-top:14px"><h1 style="font-size:26px">Classic Burger</h1><b style="color:var(--dg)">${X.star} 4.8</b></div><p style="margin:6px 0;font-size:14px">Juicy beef patty, fresh lettuce, tomato and our signature sauce.</p><div class="row"><b style="font-size:22px">${K(450)}</b><div class="row" style="background:var(--sg);border-radius:20px;padding:4px"><button data-a="q" data-k="-1" style="width:36px;height:36px;font-size:20px">−</button><b>${S.q}</b><button data-a="q" data-k="1" style="width:36px;height:36px;font-size:20px">+</button></div></div>${[['ch','Extra cheese',80],['sa','Extra sauce',40],['fr','Add fries',120]].map(e=>`<div class="row" data-a="x" data-k="${e[0]}" style="padding:10px 0;font-weight:600;cursor:pointer"><span class="row" style="justify-content:flex-start"><i class="chk ${S[e[0]]?'on':''}">${S[e[0]]?X.ck:''}</i>${e[1]}</span><span class="mu">${K(e[2])}</span></div>`).join('')}<button class="btn" style="margin-top:8px" data-a="go">Add to cart — ${K(items()[0][1])}</button><div class="chip" style="position:absolute;top:62px;right:20px;background:#fff">${X.cart} ${S.cart}</div></div>`,
cart:()=>S.cart?`<div class="s sg" style="padding-top:62px"><h1>Your Cart</h1>${sum().replace('margin:12px 0','margin:14px 0')}<button class="btn" data-a="go">Proceed to checkout</button>${nv('cart')}</div>`:`<div class="s sg" style="text-align:center;padding-top:200px">${I('bag',120)}<h2>Your cart is empty</h2><p>Add something tasty to get started.</p>${nv('cart')}</div>`,
checkout:(m)=>`<div class="s sg" style="padding-top:62px"><h1>Checkout</h1><div class="card row" style="margin:12px 0"><div><b>${X.pin} Home</b><p style="font-size:13px">Thika Road, Nairobi</p></div><span class="chip" data-a="t" data-m="Address picker opens">Change</span></div><div class="inp" style="background:#fff"><small>Delivery instructions</small>Leave at the gate</div>${sum()}<h2 style="font-size:17px;margin-bottom:8px">Payment method</h2>${[['Pay online','M-Pesa · Card','Pay securely online',1],['Pay on delivery','Cash on arrival','Pay when your order arrives',0]].map(o=>`<div class="card row" data-a="pm" data-k="${o[3]}" style="margin-bottom:8px;border:2px solid ${(m==1)==!!o[3]?'var(--g)':'transparent'}"><div><b>${o[0]}</b><p style="font-size:12px">${o[2]}</p></div><b style="font-size:12px">${o[1]}</b></div>`).join('')}</div>`,
pay:(w)=>SC.checkout(1)+`<div class="ov"></div><div class="sheet ${w?'n':''}">${w?`<div class="sp"></div><h2 style="text-align:center;margin-top:18px">Waiting for payment</h2><p style="text-align:center;margin-top:6px">Check your phone and enter your M-Pesa PIN.</p><div style="text-align:center;margin-top:14px;color:var(--g)">${X.phone}</div>`:`<h2>Complete payment</h2><b style="font-size:30px;display:block;margin:6px 0 12px">${K(tot())}</b><div class="row" style="margin-bottom:10px"><span class="chip on" style="flex:1;text-align:center">M-Pesa</span><span class="chip" style="flex:1;text-align:center" data-a="t" data-m="Card form opens here">Card</span></div><div class="inp"><small>M-Pesa number</small>0712 345 678</div><button class="btn" style="margin-top:12px" data-a="go">Send payment request</button>`}</div>`,
success:()=>`<div class="s dk" style="text-align:center;padding-top:190px">${ck()}<h1 style="margin-top:22px">Payment successful!</h1><b style="font-size:30px;display:block;margin:10px 0">${K(tot())}</b><p>Your payment has been received.</p><p style="margin:4px 0 30px">Order #WM10248 · <span class="tag tp">Paid</span></p><button class="btn" data-a="go">Track my order</button></div>`,
pod:()=>`<div class="s dk" style="text-align:center;padding-top:190px">${ck()}<h1 style="margin-top:22px">Order confirmed!</h1><p style="margin:10px 0">You will pay ${K(tot())} when your order arrives.</p><p>Order #WM10249</p><span class="tag tw" style="margin:12px 0 26px">Payment due on delivery</span><button class="btn" data-a="go">Track my order</button></div>`,
track:(k)=>`<div class="s" style="padding-top:62px"><h1 style="font-size:24px;margin-bottom:10px">Track your order</h1><div style="margin-left:-6px">${mapSvg()}</div><div style="margin-top:8px">${trk(k)}</div></div>`,
delivered:()=>`<div class="s dk" style="text-align:center;padding-top:150px">${ck()}<div class="fl" style="margin:10px 0">${I('bag',110)}</div><h1>Enjoy your meal!</h1><p style="margin:8px 0">Your order has been delivered.</p><p>#WM10248 · <span class="tag tp">Delivered</span></p><button class="btn" style="margin-top:26px" data-a="go">Rate your experience</button></div>`};
/* admin */
const O=[['#WM10248','John Doe',1060,'Preparing','M-Pesa','Paid'],['#WM10247','Sarah Wanjiku',840,'On delivery','Pay on delivery','Payment due'],['#WM10246','Peter Otieno',1450,'Delivered','Card','Paid'],['#WM10245','Amina Hassan',700,'New','M-Pesa','Paid']];
O[0][2]=670;const FL=['New','Preparing','Ready','On delivery','Delivered'];let sel=0,tab='All';
const st=s=>`<span class="tag ${s=='Delivered'||s=='Paid'?'tp':s=='Payment due'||s=='New'?'tw':'tb'}">${s}</span>`;
const orderRows=()=>O.filter(o=>tab=='All'||o[3]==tab).map(o=>`<div class="tr ${O[sel]==o?'on':''}" data-a="os" data-k="${O.indexOf(o)}"><b>${o[0]}</b><span>${o[1]}</span><span>${K(o[2])}</span><span>${st(o[3])} ${st(o[5])}</span></div>`).join('')||'<p style="padding:20px">No orders in this stage.</p>';
const detail=()=>{const o=O[sel],n=FL.indexOf(o[3]);return`<div class="pn"><h2>${o[0]} · ${o[1]}</h2><p>0712 345 678 · Thika Road, Nairobi</p><div class="row" style="margin:10px 0;font-weight:600"><span>Classic Burger × 1<br>Fries × 1</span><span>${K(o[2])}<br>${o[4]} ${st(o[5])}</span></div><div class="tl">${['Received','Preparing','Ready','Out for delivery','Delivered'].map((t,j)=>`<div class="${j<=n+(n>0?0:0)&&j<=n+0?'d':''}${j<=n?' d':''}"><i>${j<=n?X.ck:''}</i>${t}</div>`).join('')}</div><button class="ab" data-a="adv" data-k="2">Mark as ready</button><button class="ab k" data-a="adv" data-k="3">Send to delivery</button></div>`};
const bars=[40,62,48,80,66,95,72],AD={
a0:()=>`<h1>Overview</h1><div class="st4">${[['KSh 184,500',"Today's sales"],['248','Orders'],['1,842','Customers'],['17','Active deliveries']].map(a=>`<div class="stat"><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="two"><div class="pn"><h2>Sales overview</h2><svg viewBox="0 0 280 130" width="100%">${bars.map((b,i)=>`<rect class="bar" style="animation-delay:${i*.08}s" x="${10+i*38}" y="${120-b}" width="26" height="${b}" rx="7" fill="${i==5?'#06C755':'#cfe9d9'}"/>`).join('')}</svg><p style="font-size:12px">Avg order KSh 744 · On-time delivery 94%</p></div><div class="pn"><h2>Payment split</h2>${[['M-Pesa',62],['Card',23],['Pay on delivery',15]].map(p=>`<div style="margin:8px 0;font-weight:600;font-size:13px">${p[0]} — ${p[1]}%<div style="height:8px;background:var(--sg);border-radius:6px;margin-top:4px"><div class="bar" style="height:8px;width:${p[1]}%;background:var(--g);border-radius:6px;transform-origin:left;animation-name:gr"></div></div></div>`).join('')}</div></div><div class="pn"><h2>Live orders</h2>${orderRows()}</div><style>@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>`,
a1:()=>`<h1>Orders</h1><div class="tabs">${['All','New','Preparing','Ready','On delivery','Delivered'].map(t=>`<button class="${t==tab?'on':''}" data-a="tab" data-k="${t}">${t}</button>`).join('')}</div><div class="two"><div class="pn">${orderRows()}</div>${detail()}</div>`,
a2:()=>`<h1>Order #WM10248</h1><div class="two">${detail()}<div class="pn"><h2>Delivery</h2>${mapSvg(300,260).replace('id="mp"','').replace(/id="(rt|rv|sco|hm|hi)"/g,'')}</div></div>`,
a3:()=>`<h1>Products</h1><button class="ab" data-a="t" data-m="Add product form opens">Add product</button><div class="st4" style="margin-top:14px">${[['Classic Burger',450,'burger'],['Margherita Pizza',850,'pizza'],['Grilled Chicken',750,'chicken'],['Chocolate Cake',400,'cake']].map(p=>`<div class="stat" style="text-align:center">${I(p[2],90)}<b style="font-size:16px">${p[0]}</b><span>${K(p[1])}</span> ${st('Available').replace('tb','tp')}<div style="margin-top:8px"><button class="chip" data-a="t" data-m="Edit ${p[0]}">Edit</button> <button class="chip" data-a="t" data-m="Delete needs confirmation">Delete</button></div></div>`).join('')}</div>`,
a4:()=>`<h1>Customers</h1><div class="pn">${[['John Doe','0712 345 678',12,'8,450'],['Sarah Wanjiku','0722 100 200',10,'7,200'],['Peter Otieno','0733 555 011',7,'5,380']].map(c=>`<div class="tr" data-a="t" data-m="${c[0]} profile opens"><b>${c[0]}</b><span>${c[1]}</span><span>${c[2]} orders · KSh ${c[3]}</span>${st('Active').replace('tb','tp')}</div>`).join('')}</div>`,
a5:()=>`<h1>Payments &amp; Revenue</h1><div class="st4">${[['KSh 156,800','Total collected'],['KSh 27,700','Pending cash'],['KSh 3,200','Refunds'],['KSh 120,100','M-Pesa']].map(a=>`<div class="stat"><b style="font-size:21px">${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div><div class="pn"><h2>Transactions</h2>${O.map(o=>`<div class="tr"><b>${o[0]}</b><span>${o[4]}</span><span>${K(o[2])}</span>${st(o[5])}</div>`).join('')}</div>`,
a6:()=>`<h1>Delivery</h1><div class="two"><div class="pn">${mapSvg(380,320).replace('id="mp"','').replace(/id="(rt|rv|sco|hm|hi)"/g,'')}</div><div class="pn"><h2>Active riders</h2>${[['Kevin','#WM10247','6 min'],['Brian','#WM10248','11 min'],['Mercy','#WM10250','18 min']].map(r=>`<div class="tr" style="grid-template-columns:1fr 1fr 1fr" data-a="t" data-m="Rider ${r[0]} selected"><b>${X.sc} ${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}</div></div>`};
/* engine */
const ST=['splash','welcome','signup','done','home','product','cart','checkout','pay','wait','success','pod','t18','t10','t5','t0','delivered','bridge','a0','a1','a2','a3','a4','a5','a6'],AN=['Overview','Orders','Order #WM10248','Products','Customers','Payments','Delivery'];
const phn=k=>k[0]=='t'&&k.length<4?'track':k=='wait'?'pay':k;
function draw(back){const k=ST[S.i],a=k[0]=='a';clearTimeout(S.w);if(k=='wait')S.w=setTimeout(()=>{if(ST[S.i]=='wait')go(1)},3500);document.body.classList.toggle('adm',a);document.body.classList.toggle('brg',k=='bridge');$('#sub').textContent=a?'Operations Dashboard':'Prototype · Customer Experience';$('#pg').textContent=`Step ${String(S.i+1).padStart(2,'0')} / ${ST.length}`;
if(k=='bridge')return;
if(a){const n=S.i-18;$('#sb').innerHTML=logo(34)+'<p style="color:#fff;font-weight:700;margin:6px 0 16px">WINNIE MEALS</p>'+[['Overview',0],['Orders',1],['Products',3],['Customers',4],['Payments',5],['Delivery',6],['Reports',0],['Settings',0]].map(x=>`<button class="${(n==x[1]||(n==2&&x[1]==1))&&x[0]!='Reports'&&x[0]!='Settings'?'on':''}" data-a="adm" data-k="${x[1]}" data-m="${x[0]}">${x[0]}</button>`).join('');$('#am').innerHTML=AD['a'+n]();return}
const sc=$('#sc'),pv=sc.querySelector('.s'),pk=sc.dataset.k,nk=phn(k);
if(k[0]=='t'&&k.length<4&&pk=='track'&&$('#tkx')){$('#tkx').outerHTML=trk(k);mv(TR[k][0]);return}
if(pk==nk&&nk=='pay'){sc.innerHTML=SC.pay(k=='wait');return}
const h=k[0]=='t'&&k.length<4?SC.track(k):k=='pay'||k=='wait'?SC.pay(k=='wait'):k=='checkout'?SC.checkout(null):SC[k]();
[...sc.children].forEach((e,i)=>{if(pv)e.style.setProperty('--dx',back?'-40px':'40px');e.classList.add('out');setTimeout(()=>e.remove(),450)});
const d=document.createElement('div');d.innerHTML=h;[...d.children].forEach(c=>{c.style.setProperty('--dx',back?'-40px':'40px');sc.appendChild(c)});sc.dataset.k=nk;
if(nk=='track'){cur=0;setTimeout(()=>mv(TR[k][0]),500)}}
function fit(){const m=$('#mid'),s=Math.min(1,(m.clientHeight-4)/868,(m.clientWidth-4)/414);$('#ph').style.transform=`scale(${s})`;$('#ph').style.margin=`${-(868*(1-s))/2}px ${-(414*(1-s))/2}px`}
function toast(m){const t=$('#tt');t.textContent=m;t.classList.add('on');clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove('on'),1800)}
function go(d){const n=S.i+d;if(n<0||n>=ST.length)return;const k=ST[S.i];
if(d>0){if(k=='product'){S.fr=1;S.cart=1+S.fr;S.bump=1;toast('Added to cart')}if(k=='signup')toast('Account created');if(k=='wait')toast('Payment received');if(k=='pay')toast('Request sent to 0712 345 678')}
S.i=n;draw(d<0);S.bump=0}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=t.dataset.k,m=t.dataset.m;
if(a=='go')go(1);else if(a=='t')toast(m);
else if(a=='q'){S.q=Math.max(1,S.q+ +k);draw()}
else if(a=='x'){S[k]=!S[k]?1:0;draw()}
else if(a=='cat'){S.cat=k;draw()}
else if(a=='pm'){if(+k){S.i=8;draw()}else{S.i=11;draw()}}
else if(a=='nav'){const m2={home:4,cart:6,orders:null,profile:null}[k];m2?(S.i=m2,draw()):toast((k=='orders'?'No orders yet — your first order will appear here':'Profile: John Doe · 0712 345 678'))}
else if(a=='adm'){if(m=='Reports'||m=='Settings')toast(m+' view is outside this prototype');else{S.i=18+ +k;draw()}}
else if(a=='tab'){tab=k;draw()}else if(a=='os'){sel=+k;draw()}
else if(a=='adv'){const o=O[sel];if(FL.indexOf(o[3])<+k){o[3]=FL[+k];if(+k==4)o[5]='Paid';toast(o[0]+' → '+o[3])}draw()}});
$('#nx').onclick=()=>go(1);$('#bk').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});
addEventListener('resize',fit);fit();draw();
</script></body></html>
